<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary SEO (defaults; overwritten at runtime from resume.json) ── -->
  <title>Yeshu Kochher — Full Stack Developer | TypeScript · Node.js · React · AWS</title>
  <meta name="title"       content="Yeshu Kochher — Full Stack Developer | TypeScript · Node.js · React · AWS" />
  <meta name="description" content="Expert-vetted Full Stack Developer specialising in TypeScript, Node.js, React, AWS and cloud-native architectures. Available for freelance and contract work globally." />
  <meta name="keywords"    content="Yeshu Kochher, Full Stack Developer, TypeScript, Node.js, React, AWS, GraphQL" />
  <meta name="author"      content="Yeshu Kochher" />
  <meta name="robots"      content="index, follow" />
  <link rel="canonical"    href="https://yeshu.in/" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://yeshu.in/" />
  <meta property="og:title"       content="Yeshu Kochher — Full Stack Developer" />
  <meta property="og:description" content="Expert-vetted Full Stack Developer specialising in TypeScript, Node.js, React, AWS and cloud-native architectures." />
  <meta property="og:image"       content="https://yeshu.in/assets/images/og-cover.png" />
  <meta property="og:site_name"   content="yeshu.in" />

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:url"         content="https://yeshu.in/" />
  <meta name="twitter:title"       content="Yeshu Kochher — Full Stack Developer" />
  <meta name="twitter:description" content="Expert-vetted Full Stack Developer specialising in TypeScript, Node.js, React, AWS and cloud-native architectures." />
  <meta name="twitter:image"       content="https://yeshu.in/assets/images/og-cover.png" />

  <!-- Favicon -->
  <link rel="icon"             type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link rel="icon"             type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Structured Data — updated at runtime from resume.json -->
  <script type="application/ld+json" id="structured-data">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Yeshu Kochher",
    "url": "https://yeshu.in",
    "jobTitle": "Full Stack Developer"
  }
  </script>

  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════════════════
       NAVIGATION — rendered by JS
  ══════════════════════════════════════════════════════ -->
  <nav class="navbar" id="navbar" aria-label="Main navigation">
    <div class="container nav-inner">
      <a href="#hero" class="brand" aria-label="Yeshu Kochher — Home">
        <span class="brand-bracket">&lt;</span>YK<span class="brand-bracket">/&gt;</span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="navLinks" role="list">
        <li><a href="#about"      class="nav-link">About</a></li>
        <li><a href="#skills"     class="nav-link">Skills</a></li>
        <li><a href="#experience" class="nav-link">Experience</a></li>
        <li><a href="#projects"   class="nav-link">Projects</a></li>
        <li><a href="#contact"    class="nav-link">Contact</a></li>
        <li id="nav-hire-btn"></li>
      </ul>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════════════
       HERO
  ══════════════════════════════════════════════════════ -->
  <section id="hero" class="hero">
    <div class="hero-grid-bg" aria-hidden="true"></div>
    <div class="container hero-inner">
      <div class="hero-text" data-aos="fade-up">
        <p class="hero-greeting" id="hero-greeting"></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <h2 class="hero-title">
          <span class="typed-wrapper">
            <span class="typed" id="typed"></span><span class="cursor">|</span>
          </span>
        </h2>
        <p class="hero-summary" id="hero-summary"></p>
        <div class="hero-cta">
          <a href="#projects" class="btn btn-primary">View My Work</a>
          <a href="#contact"  class="btn btn-ghost">Get In Touch</a>
        </div>
        <div class="hero-badges" id="hero-badges"></div>
      </div>

      <div class="hero-visual" data-aos="fade-left" data-aos-delay="200" aria-hidden="true">
        <div class="code-window">
          <div class="code-window-header">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="code-window-title" id="code-filename"></span>
          </div>
          <pre class="code-window-body"><code id="code-body"></code></pre>
        </div>
      </div>
    </div>
    <a href="#about" class="hero-scroll-cue" aria-label="Scroll down to About">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 9l-7 7-7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </section>

  <!-- ══════════════════════════════════════════════════════
       ABOUT
  ══════════════════════════════════════════════════════ -->
  <section id="about" class="section section-alt">
    <div class="container">
      <h2 class="section-heading" data-aos="fade-up">
        <span class="section-tag">01.</span> About Me
      </h2>
      <div class="about-grid">
        <div class="about-text" data-aos="fade-right">
          <div id="about-paragraphs"></div>
          <ul class="about-facts" id="about-facts" role="list"></ul>
          <a id="about-resume-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
            View Full Resume
          </a>
        </div>
        <div class="about-stats" id="about-stats" data-aos="fade-left" data-aos-delay="100"></div>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════
       SKILLS
  ══════════════════════════════════════════════════════ -->
  <section id="skills" class="section">
    <div class="container">
      <h2 class="section-heading" data-aos="fade-up">
        <span class="section-tag">02.</span> Tech Stack
      </h2>
      <div class="skills-grid" id="skills-grid" data-aos="fade-up" data-aos-delay="100"></div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════
       EXPERIENCE
  ══════════════════════════════════════════════════════ -->
  <section id="experience" class="section section-alt">
    <div class="container">
      <h2 class="section-heading" data-aos="fade-up">
        <span class="section-tag">03.</span> Experience
      </h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════
       PROJECTS
  ══════════════════════════════════════════════════════ -->
  <section id="projects" class="section">
    <div class="container">
      <h2 class="section-heading" data-aos="fade-up">
        <span class="section-tag">04.</span> Featured Projects
      </h2>
      <div class="projects-grid" id="projects-grid"></div>
      <div class="projects-footer" data-aos="fade-up">
        <a id="github-all-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
          View All on GitHub
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        </a>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════
       CONTACT
  ══════════════════════════════════════════════════════ -->
  <section id="contact" class="section section-alt">
    <div class="container">
      <h2 class="section-heading" data-aos="fade-up">
        <span class="section-tag">05.</span> Get In Touch
      </h2>
      <div class="contact-grid">
        <div class="contact-text" data-aos="fade-right">
          <p class="contact-intro" id="contact-intro"></p>
          <div class="contact-links" id="contact-links"></div>
        </div>

        <form id="contactForm" class="contact-form" data-aos="fade-left" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="contactName">Name</label>
              <input type="text" id="contactName" name="name" placeholder="Your name" required autocomplete="name" />
            </div>
            <div class="form-group">
              <label for="contactEmail">Email</label>
              <input type="email" id="contactEmail" name="email" placeholder="you@company.com" required autocomplete="email" />
            </div>
          </div>
          <div class="form-group">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full">
            Send Message
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <p class="form-note" id="formStatus" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════════════════ -->
  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-copy">
        Designed &amp; Built by <strong>Yeshu Kochher</strong> &copy; <span id="year"></span>
      </p>
      <div class="footer-socials" id="footer-socials" aria-label="Social links"></div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>
</html>
